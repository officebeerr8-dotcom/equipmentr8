<script>

// ==================== RECEIVE ====================
async function loadReceiveDocs() {
  const month = document.getElementById('receiveMonth').value;
  let query = sb.from('receive_docs').select('*').order('date', { ascending: false });

  if (month) {
    const start = month + '-01';

    // ✅ FIX: ใช้เดือนถัดไปแทน -31
    const [y, m] = month.split('-').map(Number);
    const nextMonth = new Date(y, m, 1);
    const end = nextMonth.toISOString().slice(0,10);

    query = query.gte('date', start).lt('date', end);
  }

  const { data, error } = await query;
  if (error) {
    console.log(error);
    toast('โหลดรายการรับเข้าไม่ได้: ' + error.message, 'error');
    return;
  }

  receiveDocs = data || [];

  if (receiveDocs.length) {
    const ids = receiveDocs.map(d => d.id);
    const { data: lines } = await sb.from('receive_lines').select('*').in('doc_id', ids);
    receiveLineItems = lines || [];
  } else {
    receiveLineItems = [];
  }

  renderReceiveDocs();
}
