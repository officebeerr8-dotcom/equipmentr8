<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment Inventory</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&display=swap');

:root{
  --bg:#fafafa;
  --surface:#fff;
  --border:#dbdbdb;
  --text:#222;
  --text2:#666;
  --blue:#0095f6;
  --danger:#ed4956;
  --success:#1ca34a;
}

*{box-sizing:border-box;font-family:'Noto Sans Thai',sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}

.page{display:none;padding-bottom:80px}
.page.active{display:block}

/* ===== Cards / Tables ===== */
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid var(--border);font-size:13px}
th{background:#f0f0f0;font-size:11px;color:var(--text2)}
.empty{text-align:center;padding:30px;color:var(--text2)}

.photo-placeholder{
  width:44px;height:44px;border:1px dashed var(--border);
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:#aaa
}

/* ===== Image ===== */
.img-thumb{
  width:80px;margin:auto;text-align:center
}
.img-thumb img{
  width:100%;border-radius:6px;border:1px solid var(--border);
}

/* ===== Fullscreen Image ===== */
#imageViewModal{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  display:none;z-index:999
}
#imageViewModal.open{display:flex;align-items:center;justify-content:center}
#imageViewModal img{
  max-width:100%;max-height:100%;object-fit:contain
}

/* ===== Mobile-first ===== */
@media(max-width:480px){
  td{font-size:12px}
}
</style>
</head>

<body>

<!-- ===== IMAGE VIEWER ===== -->
<div id="imageViewModal" onclick="this.classList.remove('open')">
  <img id="imageViewImg">
</div>

<div class="page active" id="page-receive">
<h3 style="padding:10px">📥 รายการรับเข้า</h3>
<input id="receiveSearch" placeholder="🔍 ค้นหาเลขที่ / วัสดุ" oninput="renderReceiveDocs()"
 style="width:95%;margin:10px;padding:8px">

<table>
<thead>
<tr>
<th>เลขที่</th>
<th>วันที่</th>
<th>รายการ</th>
<th>รูป</th>
</tr>
</thead>
<tbody id="receiveTableBody"></tbody>
</table>
</div>

<div class="page" id="page-issue">
<h3 style="padding:10px">📤 รายการจ่ายออก</h3>
<input id="issueSearch" placeholder="🔍 ค้นหาเลขที่ / วัสดุ" oninput="renderIssueDocs()"
 style="width:95%;margin:10px;padding:8px">

<table>
<thead>
<tr>
<th>เลขที่</th>
<th>วันที่</th>
<th>ผู้เบิก</th>
<th>รายการ</th>
<th>รูป</th>
</tr>
</thead>
<tbody id="issueTableBody"></tbody>
</table>
</div>

<script>
/* ===== Supabase ===== */
const sb = supabase.createClient(
  'https://YOUR_PROJECT.supabase.co',
  'YOUR_ANON_KEY'
);

/* ===== State ===== */
let materials=[], stockMap={};
let receiveDocs=[], receiveLineItems=[];
let issueDocs=[], issueLineItems=[];

/* ===== Init ===== */
init();
async function init(){
  await loadMaterials();
  await loadReceiveDocs();
  await loadIssueDocs();
}

/* ===== Load ===== */
async function loadMaterials(){
  const {data}=await sb.from('materials').select('*');
  materials=data||[];
}

async function loadReceiveDocs(){
  const {data}=await sb.from('receive_docs').select('*').order('date',{ascending:false});
  receiveDocs=data||[];
  if(receiveDocs.length){
    const ids=receiveDocs.map(d=>d.id);
    const {data:lines}=await sb.from('receive_lines').select('*').in('doc_id',ids);
    receiveLineItems=lines||[];
  }
  renderReceiveDocs();
}

async function loadIssueDocs(){
  const {data}=await sb.from('issue_docs').select('*').order('date',{ascending:false});
  issueDocs=data||[];
  if(issueDocs.length){
    const ids=issueDocs.map(d=>d.id);
    const {data:lines}=await sb.from('issue_lines').select('*').in('doc_id',ids);
    issueLineItems=lines||[];
  }
  renderIssueDocs();
}

/* ===== Render Receive ===== */
function renderReceiveDocs(){
  const q=(receiveSearch.value||'').toLowerCase();
  receiveTableBody.innerHTML='';
  const rows=receiveDocs.filter(d=>{
    const lines=receiveLineItems.filter(l=>l.doc_id===d.id);
    const txt=[d.doc_number,...lines.map(l=>{
      const m=materials.find(x=>x.id===l.material_id);
      return m?.name;
    })].join(' ').toLowerCase();
    return txt.includes(q);
  });

  if(!rows.length){
    receiveTableBody.innerHTML=`<tr><td colspan="4"><div class="empty">ไม่พบข้อมูล</div></td></tr>`;
    return;
  }

  receiveTableBody.innerHTML=rows.map(d=>{
    const lines=receiveLineItems.filter(l=>l.doc_id===d.id);
    const m=materials.find(x=>x.id===lines[0]?.material_id);
    const img=m?.images?.[0];
    const summary=lines.map(l=>{
      const mm=materials.find(x=>x.id===l.material_id);
      return `${mm?.name} x${l.qty}`;
    }).join(', ');
    return `
    <tr>
      <td>${d.doc_number}</td>
      <td>${d.date}</td>
      <td>${summary}</td>
      <td>${img?
        `<div class="img-thumb" onclick="viewImage('${img}')"><imgaceholder">📦</div>`}
      </td>
    </tr>`;
  }).join('');
}

/* ===== Render Issue ===== */
function renderIssueDocs(){
  const q=(issueSearch.value||'').toLowerCase();
  issueTableBody.innerHTML='';
  const rows=issueDocs.filter(d=>{
    const lines=issueLineItems.filter(l=>l.doc_id===d.id);
    const txt=[d.doc_number,d.requester,...lines.map(l=>{
      const m=materials.find(x=>x.id===l.material_id);
      return m?.name;
    })].join(' ').toLowerCase();
    return txt.includes(q);
  });

  if(!rows.length){
    issueTableBody.innerHTML=`<tr><td colspan="5"><div class="empty">ไม่พบข้อมูล</div></td></tr>`;
    return;
  }

  issueTableBody.innerHTML=rows.map(d=>{
    const lines=issueLineItems.filter(l=>l.doc_id===d.id);
    const m=materials.find(x=>x.id===lines[0]?.material_id);
    const img=m?.images?.[0];
    const summary=lines.map(l=>{
      const mm=materials.find(x=>x.id===l.material_id);
      return `${mm?.name} x${l.qty}`;
    }).join(', ');
    return `
    <tr>
      <td>${d.doc_number}</td>
      <td>${d.date}</td>
      <td>${d.requester}</td>
      <td>${summary}</td>
      <td>${img?
        `<div class="img-thumb" onclick="viewImage('${img}')">${img}</div>`:
        `<div class="photo-placeholder">📦</div>`}
      </td>
    </tr>`;
  }).join('');
}

/* ===== Image Viewer ===== */
function viewImage(url){
  imageViewImg.src=url;
  imageViewModal.classList.add('open');
}
</script>

</body>
</html>
