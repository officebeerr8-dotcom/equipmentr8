<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment Inventory</title>

<!-- ✅ Supabase SDK (ต้องเป็น script แบบนี้ เท่านั้น) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

<style>
body{margin:0;font-family:system-ui,'Noto Sans Thai',sans-serif;background:#fafafa}
header{padding:12px;background:#fff;border-bottom:1px solid #ddd}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd}
nav button{
  flex:1;padding:10px;border:none;background:#fff;cursor:pointer
}
nav button.active{border-bottom:2px solid #0095f6;font-weight:600}
.page{display:none;padding:12px}
.page.active{display:block}
.card{
  background:#fff;border:1px solid #ddd;border-radius:8px;
  padding:10px;margin-bottom:10px
}
.status{padding:12px;color:#555}
.error{color:#c00}
.success{color:#060}
</style>
</head>

<body>

<header>
  <strong>📦 Equipment Inventory</strong>
</header>

<nav>
  <button id="tab-dashboard" class="active" onclick="showPage('dashboard')">ภาพรวม</button>
  <button id="tab-receive" onclick="showPage('receive')">รับเข้า</button>
  <button id="tab-issue" onclick="showPage('issue')">เบิก‑จ่าย</button>
</nav>

<div id="status" class="status">กำลังโหลด…</div>

<!-- ===== PAGES ===== -->
<div id="page-dashboard" class="page active">
  <div class="card">ยินดีต้อนรับสู่ระบบ</div>
</div>

<div id="page-receive" class="page">
  <div id="receiveList"></div>
</div>

<div id="page-issue" class="page">
  <div id="issueList"></div>
</div>

<script>
/* =====================================================
   SAFE BOOTSTRAP
   ===================================================== */

window.addEventListener('load', () => {
  if (typeof supabase === 'undefined') {
    status.innerHTML =
      '<span class="error">❌ โหลด Supabase SDK ไม่ได้</span>';
    return;
  }
  init();
});

/* ================= CONFIG ================= */
const SUPABASE_URL = 'https://zljfwhnimgjghsthcxjn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsamZ3aG5pbWdqZ2hzdGhjeGpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NzIwNDEsImV4cCI6MjA5MTM0ODA0MX0.9R5FvHtIf1HGyqo7S8Yn3Ln1tzRI8fQHxOkNFPyLt_M
';
let sb;

/* ================= INIT ================= */
async function init(){
  try{
    sb = supabase.createClient(https://zljfwhnimgjghsthcxjn.supabase.co, eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsamZ3aG5pbWdqZ2hzdGhjeGpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NzIwNDEsImV4cCI6MjA5MTM0ODA0MX0.9R5FvHtIf1HGyqo7S8Yn3Ln1tzRI8fQHxOkNFPyLt_M
);
  }catch(e){
    status.innerHTML =
      '<span class="error">❌ สร้าง Supabase client ไม่สำเร็จ</span>';
    return;
  }

  status.innerHTML =
    '<span class="success">✅ โหลด UI สำเร็จ</span>';

  loadReceive();
  loadIssue();
}

/* ================= MENU ================= */
function showPage(id){
  document.querySelectorAll('.page')
    .forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button')
    .forEach(b=>b.classList.remove('active'));

  document.getElementById('page-'+id).classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}

/* ================= DATA LOAD ================= */
async function loadReceive(){
  const el = document.getElementById('receiveList');
  el.innerHTML = '<div class="status">กำลังโหลดรับเข้า…</div>';

  try{
    const {data,error} = await sb
      .from('receive_docs')
      .select('doc_number,date')
      .order('date',{ascending:false})
      .limit(5);

    if(error) throw error;

    if(!data?.length){
      el.innerHTML = '<div class="status">ไม่มีข้อมูล</div>';
      return;
    }

    el.innerHTML = data.map(d=>`
      <div class="card">
        <strong>${d.doc_number}</strong><br>
        วันที่ ${d.date}
      </div>
    `).join('');
  }catch{
    el.innerHTML =
      '<div class="status error">⚠️ โหลดรับเข้าไม่ได้ แต่ UI ยังทำงาน</div>';
  }
}

async function loadIssue(){
  const el = document.getElementById('issueList');
  el.innerHTML = '<div class="status">กำลังโหลดเบิก‑จ่าย…</div>';

  try{
    const {data,error} = await sb
      .from('issue_docs')
      .select('doc_number,date')
      .order('date',{ascending:false})
      .limit(5);

    if(error) throw error;

    if(!data?.length){
      el.innerHTML = '<div class="status">ไม่มีข้อมูล</div>';
      return;
    }

    el.innerHTML = data.map(d=>`
      <div class="card">
        <strong>${d.doc_number}</strong><br>
        วันที่ ${d.date}
      </div>
    `).join('');
  }catch{
    el.innerHTML =
      '<div class="status error">⚠️ โหลดเบิก‑จ่ายไม่ได้ แต่ UI ยังทำงาน</div>';
  }
}
</script>

</body>
</html>
