const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let receiveDocs = [];
let receiveLineItems = [];
let issueDocs = [];
let issueLineItems = [];

function show(data) {
  document.getElementById('output').textContent = JSON.stringify(data, null, 2);
}

// ================= RECEIVE =================
async function loadReceiveDocs() {
  const month = document.getElementById('receiveMonth').value;
  let query = sb.from('receive_docs').select('*').order('date', { ascending: false });

  if (month) {
    const start = month + '-01';

    // ✅ FIX เดือน
    const [y, m] = month.split('-').map(Number);
    const nextMonth = new Date(y, m, 1);
    const end = nextMonth.toISOString().slice(0,10);

    query = query.gte('date', start).lt('date', end);
  }

  const { data, error } = await query;

  if (error) {
    console.error('RECEIVE ERROR:', error);
    alert(error.message);
    return;
  }

  receiveDocs = data || [];

  if (receiveDocs.length > 0) {
    const ids = receiveDocs.map(d => d.id);

    const { data: lines, error: lineError } = await sb
      .from('receive_lines')
      .select('*')
      .in('doc_id', ids);

    if (lineError) console.error('RECEIVE LINES ERROR:', lineError);

    receiveLineItems = lines || [];
  } else {
    receiveLineItems = [];
  }

  show({ receiveDocs, receiveLineItems });
}
